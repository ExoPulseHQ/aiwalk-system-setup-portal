[package]
name = "aiwalk-setup"
version = "0.3.12"
edition = "2021"
description = "aIwalk System Setup, Tauri edition (desktop)"

# the Android app is this crate as a library (src/lib.rs, empty on a computer); computers run src/main.rs
[lib]
name = "aiwalk_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
exo-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
# Cloudflare Access without cloudflared (access.rs): SSH over a WebSocket, Access's RS256 signatures, JWTs
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ring = "0.17"
base64 = "0.22"
age = { version = "0.11", features = ["armor"] }
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "salsa20"] }
fancy-regex = "0.19.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
portable-pty = "0.9"

# Android opens web addresses (the two sign-ins) in the phone's browser through this plugin
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }

# session keeper (sessioncli.rs): setsid, kill and getuid on Unix; named pipes with a private DACL on Windows.
# Both are already in the dependency tree through other crates.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }
