[package]
name = "aiwalk-setup"
version = "0.3.44"
edition = "2021"
description = "aIwalk System Setup, Tauri edition (desktop)"

# the Android app is this crate as a library (src/lib.rs, empty on a computer); computers run src/main.rs
[lib]
name = "aiwalk_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# phone-git: compiles the phone's git (src/phonegit.rs) on a computer too, for its test only:
#   cargo test -p aiwalk-setup --features phone-git phonegit
# The computer app never enables it and keeps calling the git program.
[features]
phone-git = ["dep:git2"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
exo-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
# Cloudflare Access without cloudflared (access.rs): SSH over a WebSocket, Access's RS256 signatures, JWTs
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ring = "0.17"
# sshc.rs: the SSH client built into the app, over the same WebSocket, so no computer or phone needs OpenSSH
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rand = "0.10"
# fidokey.rs: AES-256 for the security key's PIN protocol (already in the tree through another crate)
aes = "0.9"
# a sign-in on a computer is approved from a phone: the code or address to open is shown as a QR code to scan
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
age = { version = "0.11", features = ["armor"] }
# agefido.rs: the FIDO2 key format of age-plugin-fido2-hmac, done in the app (all already in the tree through age)
age-core = "0.11"
x25519-dalek = { version = "2", features = ["static_secrets"] }
bech32 = "0.9"
secrecy = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "salsa20"] }
fancy-regex = "0.19.2"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"], optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
portable-pty = "0.9"

# Android opens web addresses (the two sign-ins) in the phone's browser through this plugin
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-opener = "2"
# a phone has no git program: the vault is downloaded and updated by libgit2 inside the app (phonegit.rs says why this one)
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
# fidokey.rs: the security key on the phone's USB port, through KeyUsb.kt (both already in the tree through tao)
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# fidokey.rs: lists security keys (macOS and Windows) and talks to them (macOS)
hidapi = "2"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }

# session keeper (sessioncli.rs): setsid, kill and getuid on Unix; named pipes with a private DACL on Windows.
# Both are already in the dependency tree through other crates.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_Networking_WindowsWebServices", "Win32_UI_WindowsAndMessaging"] }
