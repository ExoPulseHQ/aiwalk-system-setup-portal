<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>aIwalk System Setup</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<nav>
  <div class="app"><span class="word">aIwalk</span><span class="tagline">System Setup</span></div>
  <button data-page="team" data-icon="key-round">Team access</button>
  <button data-page="machines" data-icon="server">Machines</button>
  <button data-page="people" data-icon="users-round" hidden>People</button>
  <button data-page="android" data-icon="smartphone" class="linux">Android phone <span class="os">Linux</span></button>
  <button data-page="vm" data-icon="app-window" class="linux">Windows VM <span class="os">Linux</span></button>
  <div class="gap"></div>
  <button data-page="terms" data-icon="scroll-text">Terms</button>
  <div id="ver"></div>
</nav>
<main>
  <div id="topline" role="progressbar" aria-label="Working"></div>
  <div class="page" id="android" hidden></div>
  <div class="page" id="vm" hidden></div>
  <div class="page" id="team" hidden></div>
  <div class="page" id="machines" hidden></div>
  <div class="page" id="people" hidden></div>
  <div class="page" id="terms" hidden></div>
</main>
<div id="toast"></div>
<dialog id="dialog"></dialog>
<div id="tip" role="tooltip" hidden></div>
<script src="icons.js"></script>
<script>
const listen = window.__TAURI__.event.listen;
// Every call to the app's backend shows the top line while it runs, except the quiet background checks.
const QUIET = new Set(["start_page", "phones", "vm_state", "platform", "tools", "default_folder", "vault_local", "reachable", "ssh_status", "claude_state", "machine_status", "forwards"]);
let pendingCalls = 0;
function invoke(cmd, args) {
  const loud = !QUIET.has(cmd);
  // counted once: when the answer comes, or after two minutes without one (a backend that died mid-command never
  // answers, and the line would run for ever)
  let counted = loud;
  const done = () => { if (counted) { counted = false; document.getElementById("topline").classList.toggle("on", --pendingCalls > 0); } };
  if (loud) { document.getElementById("topline").classList.toggle("on", ++pendingCalls > 0); setTimeout(done, 120000); }
  return window.__TAURI__.core.invoke(cmd, args).finally(done);
}

// The button pressed shows what is happening until `job` settles; returns job's result (or throws its error).
async function working(button, label, job) {
  const before = [...button.childNodes], wasDisabled = button.disabled;
  button.disabled = true; button.classList.add("working");
  button.replaceChildren(el("span", "spinner"), label);
  try { return await job(); }
  finally { if (button.isConnected) { button.replaceChildren(...before); button.disabled = wasDisabled; button.classList.remove("working"); } }
}

// A list row that was clicked: spinner on the right, no second click until the page redraws.
function busyRow(row) { if (!row) return; row.classList.add("busy"); row.append(el("span", "spinner")); }

// A spinner, a sentence and a meter, for waits with known steps. set(fraction or null, text).
function stage(text) {
  const box = el("div", "stage"), line = el("div", "line"), meter = el("div", "meter"), fill = el("i");
  const words = el("span", null, text);
  line.append(el("span", "spinner"), words); meter.append(fill); box.append(line, meter);
  meter.hidden = true;
  box.set = (f, t) => { if (t) words.textContent = t; if (f != null) { meter.hidden = false; fill.style.width = `${Math.round(f * 100)}%`; } };
  return box;
}
// The operating system the backend runs on (the `platform` command): a computer ("linux", "macos", "windows") can
// start a terminal for the SSH button; a phone build answers "android" or "ios" and shows only the line to copy.
let OS = null;
const canOpenTerminal = () => ["linux", "macos", "windows"].includes(OS);
// A phone runs no programs: no git, vault downloads, Claude Code, desktops, host tools or app updates there.
const onPhone = () => ["android", "ios"].includes(OS);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

let toastTimer;
function toast(text) {
  if (!text) return;
  const t = document.getElementById("toast");
  t.textContent = text; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = "none", 5000);
}

// ask(title, body, [[id, label, primary?]...], extra element) -> the id chosen, or null when dismissed
function ask(title, body, buttons, extra) {
  const d = document.getElementById("dialog");
  d.replaceChildren(el("h3", null, title), el("p", null, body));
  if (extra) d.append(extra);
  const row = el("div", "buttons");
  return new Promise(done => {
    buttons.forEach(([id, label, primary]) => {
      const b = el("button", primary ? "" : "ghost", label);
      b.onclick = () => { d.close(); done(id); };
      row.append(b);
    });
    d.append(row);
    d.onclose = () => done(null);
    d.showModal();
  });
}

// One row in a list: title, subtitle, and whatever controls go on the right. Title and subtitle are text or a node.
function item(title, sub, onclick, ...right) {
  const r = el("div", "item" + (onclick ? " click" : ""));
  const t = el("div", "text"), head = el("div", "title");
  head.append(...[title].flat());
  t.append(head);
  if (sub) { const s = el("div", "sub"); s.append(sub); if (sub instanceof Element && sub.classList.contains("chip")) s.classList.add("has-chip"); t.append(s); }
  r.append(t, ...right);
  if (onclick) r.onclick = onclick;
  return r;
}

// ---------------------------------------------------------------- the visual vocabulary (app.css, DESIGN.md)
// An icon from icons.js: decoration beside its words, so hidden from assistive tech; the words or an aria-label name it.
function icon(name) {
  if (!ICONS[name]) throw new Error(`no icon ${name} in icons.js`);
  const i = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  i.setAttribute("viewBox", "0 0 24 24"); i.setAttribute("aria-hidden", "true"); i.setAttribute("focusable", "false");
  i.setAttribute("class", "icon"); i.dataset.icon = name; i.innerHTML = ICONS[name];
  return i;
}
// A row that says what it is: its icon first, in a column of its own.
const kind = (row, name) => { row.prepend(icon(name)); return row; };
// The identity chip, for a login or a machine name; `tip` says what else there is to know (the person's name).
function chip(text, tip, cls = "") {
  const c = el("span", "chip" + (cls ? " " + cls : ""), text);
  if (tip) c.dataset.tip = tip;
  return c;
}
// A button with an icon: words beside it, or (iconOnly) the words as its accessible name and tooltip only.
function iconButton(name, words, cls = "small ghost", iconOnly = false) {
  const b = el("button", cls + (iconOnly ? " icon-only" : ""));
  b.append(icon(name));
  if (iconOnly) { b.setAttribute("aria-label", words); b.dataset.tip = words; } else b.append(words);
  return b;
}
// A state, level or tag shown as its glyph: the word stays for assistive tech, the tooltip says it in full. Focusable,
// so the tooltip also opens from the keyboard.
function glyph(cls, name, word, tip) {
  const g = el("span", cls + " glyph");
  g.append(icon(name), el("span", "sr", word));
  g.dataset.tip = tip; g.tabIndex = 0;
  return g;
}
// An explanation behind a small info mark, appended to the heading or label it explains.
function info(text) {
  const b = el("button", "info"); b.type = "button";
  b.dataset.tip = text; b.setAttribute("aria-label", text);
  b.append(icon("info"));
  return b;
}
// A state chip's content: an icon, then its words; `lead` is said to assistive tech and the tooltip but not shown.
function stateText(node, name, text, lead) {
  node.replaceChildren(...(name ? [icon(name)] : []), ...(lead ? [el("span", "sr", lead)] : []), text);
  if (lead) node.dataset.tip = lead + text; else delete node.dataset.tip;
  return node;
}

// The page's opening strip, under its name: [tone, sentence, detail, items], or null to have none. The sentence and
// detail are what a screen reader hears; each item is focusable and named by its tooltip.
// item: {icon, num, unit, chips: [login], text, tone: warn | bad | act | calm, tip}
function setOpening(page, got) {
  const old = page.querySelector(".opening"), h1 = page.querySelector("h1");
  if (h1) h1.classList.toggle("page-name", !!got);
  if (!got) { if (old) old.remove(); return; }
  const [tone, sentence, detail, items] = got;
  const box = el("div", "opening"); box.setAttribute("role", "status");
  const strip = el("div", "strip"); strip.dataset.tone = tone;
  const m = el("span", "state-mark"); m.setAttribute("aria-hidden", "true");
  m.append(icon({ ok: "circle-check", warn: "circle-alert", bad: "circle-x", wait: "circle-dashed", off: "power" }[tone]));
  strip.append(m, el("span", "sr", [sentence, ...detail].join(" ")));
  items.forEach(({ icon: name, num, unit, chips = [], text, tone: t, tip }) => {
    const it = el("span", "fig" + (t ? " " + t : ""));
    it.tabIndex = 0; it.dataset.tip = tip; it.setAttribute("role", "img"); it.setAttribute("aria-label", tip);
    if (name) it.append(icon(name));
    if (num !== undefined) it.append(el("span", "fig-num", String(num)));
    if (unit) it.append(el("span", "fig-unit", unit));
    chips.forEach(l => it.append(chip(l)));
    if (text) it.append(el("span", "fig-text", text));
    strip.append(it);
  });
  box.append(strip);
  // after the page name; where the name shares a row with a button, after that row
  const at = h1 && h1.parentNode.classList.contains("row") ? h1.parentNode : h1;
  if (old) old.replaceWith(box); else if (at) at.after(box); else page.prepend(box);
}
const plural = (k, one, many = one + "s") => `${k} ${k === 1 ? one : many}`;

// One primary (purple) button per page: the first button made a candidate with data-primary, else the first button
// that is not secondary (ghost), outside a folded drawer, the language switch, the segmented control and the tiles.
// Pages that act through their rows (Windows VM, Android phone) have none. Called after redraws that change buttons.
const NO_PRIMARY = new Set(["vm", "android"]);
function pickPrimary(page) {
  if (!page) return;
  const all = [...page.querySelectorAll("button")];
  const live = all.filter(b => !b.closest(".lang, .segmented, .drawer:not(.open)") && !b.matches(".tile, .info, .x, .perm") && (!b.disabled || b.classList.contains("working")));
  const pick = NO_PRIMARY.has(page.id) ? null : live.find(b => b.dataset.primary) || live.find(b => !b.classList.contains("ghost"));
  all.forEach(b => b.classList.toggle("primary", b === pick));
}

// The one tooltip: on hover after 120 ms, at once on keyboard focus, gone on Escape, on leaving, or when its element
// goes. Anything with data-tip has one; data-tip-narrow only while the sidebar is its icons (under 700px).
const tipBox = document.getElementById("tip");
let tipFor = null, tipTimer = 0;
function showTip(t) {
  clearTimeout(tipTimer);
  if (!t.isConnected || (t.dataset.tipNarrow && innerWidth > 700)) return hideTip();
  tipFor = t;
  tipBox.textContent = t.dataset.tip; tipBox.hidden = false;
  if (t.getAttribute("aria-label") !== t.dataset.tip) t.setAttribute("aria-describedby", "tip");
  const r = t.getBoundingClientRect(), w = tipBox.offsetWidth, h = tipBox.offsetHeight;
  const below = r.bottom + 6 + h <= innerHeight - 8;
  tipBox.style.top = `${below ? r.bottom + 6 : r.top - h - 6}px`;
  tipBox.style.left = `${Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8))}px`;
}
function hideTip() {
  clearTimeout(tipTimer);
  if (tipFor) tipFor.removeAttribute("aria-describedby");
  tipFor = null; tipBox.hidden = true;
}
const tipOf = e => e.target instanceof Element ? e.target.closest("[data-tip]") : null;
document.addEventListener("pointerover", e => {
  const t = tipOf(e);
  if (t === tipFor) return;
  clearTimeout(tipTimer);
  if (!t) return hideTip();
  tipTimer = setTimeout(() => showTip(t), 120);
});
document.addEventListener("pointerleave", hideTip);
document.addEventListener("focusin", e => { const t = tipOf(e); t ? showTip(t) : hideTip(); });
document.addEventListener("focusout", hideTip);
document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });
// focusing an element scrolls it into view: follow it rather than drop the tooltip; a redraw that took it away hides it
document.addEventListener("scroll", () => { if (tipFor) showTip(tipFor); }, true);
document.addEventListener("click", () => setTimeout(() => { if (tipFor && !tipFor.isConnected) hideTip(); }), true);

function switchBox(on, onchange) {
  const s = el("input", "switch"); s.type = "checkbox"; s.checked = on;
  s.onclick = e => e.stopPropagation();
  s.onchange = () => onchange(s.checked, s);
  return s;
}

const pages = { team: () => loadTeam(), machines: () => loadMachines(), people: () => loadPeople(), terms: () => loadTerms(), android: () => refreshPhones(true), vm: () => refreshVm() };
let current;
function go(name) {
  current = name;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.page === name));
  document.querySelectorAll(".page").forEach(p => p.hidden = p.id !== name);
  pages[name]();
}
// the sidebar: its icons, and its words as a tooltip for when it narrows to those icons
function navLabel(b, words, count) {
  b.replaceChildren(icon(b.dataset.icon), words, ...(count ? [el("span", "os", count)] : []));
  b.dataset.tip = words + (/^\d+$/.test(count || "") ? `, ${count} waiting` : "");
}
document.querySelectorAll("nav button").forEach(b => {
  b.dataset.tipNarrow = 1;
  navLabel(b, b.firstChild.textContent.trim(), (b.querySelector(".os") || {}).textContent);
  b.onclick = () => go(b.dataset.page);
});

// This version, and one button to the newest release when there is one (the bundled gh downloads it).
async function showVersion() {
  const ver = document.getElementById("ver");
  const u = await invoke("update_state");
  ver.textContent = `Version ${u.current}`;
  if (!u.newer || onPhone()) return;   // releases are for computers
  if (!u.can) { ver.textContent += `. ${u.latest} is out: install it from the Releases page.`; return; }
  const b = el("button", "update");
  b.append(icon("arrow-down-to-line"), `Update to ${u.latest}`);
  b.dataset.tip = `Update to ${u.latest}`; b.dataset.tipNarrow = 1;
  b.onclick = async () => {
    try { toast(await working(b, `Downloading ${u.latest}`, () => invoke("update_install", { tag: u.latest }))); }
    catch (e) { toast(e); }
  };
  ver.before(b);
}
</script>
<script src="team.js"></script>
<script src="android.js"></script>
<script src="vm.js"></script>
<script>
invoke("platform").then(os => {
  OS = os;
  // the phone and VM modules need a Linux computer
  if (os !== "linux") document.querySelectorAll("nav .linux").forEach(b => b.remove());
  invoke("start_page").then(p => go(p && pages[p] ? p : "team"), () => go("team"));
  showVersion();
});
</script>
</body>
</html>
