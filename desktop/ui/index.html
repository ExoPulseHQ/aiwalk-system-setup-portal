<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>aIwalk System Setup</title>
<style>
  :root { --bg: #fafafa; --fg: #1d1d1d; --card: #fff; --dim: #6b6b6b; --line: #ddd; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1e1e1e; --fg: #eee; --card: #2a2a2a; --dim: #a0a0a0; --line: #444; } }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 1.4em; margin: 0 0 4px; }
  .dim { color: var(--dim); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin: 16px 0; }
  .card h2 { font-size: 1.1em; margin: 0; }
  label { display: block; margin: 10px 0; }
  ul.tree, ul.tree ul { list-style: none; margin: 0; padding-left: 20px; border-left: 1px solid var(--line); }
  ul.tree { padding-left: 4px; border: 0; }
  li { margin: 4px 0; }
  .row { display: flex; gap: 10px; align-items: center; }
  .title { font-weight: 600; }
  .group > .row .title { font-weight: bold; }
  .detail { flex: 1; color: var(--dim); font-family: ui-monospace, monospace; font-size: .9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .perm { border-radius: 6px; padding: 2px 8px; font-weight: bold; font-size: .9em; min-width: 72px; text-align: center; }
  .p4 { background: #8C54D9; color: #fff; }
  .p3, .p2 { background: #F5843C; color: #1d1d1d; }
  .p1 { background: #F9C29B; color: #1d1d1d; }
  button { font: inherit; padding: 6px 16px; border-radius: 8px; border: 0; background: #8C54D9; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  .code { font-weight: 600; }
  h3 { font-size: 1em; margin: 16px 0 4px; }
  button.small { padding: 2px 10px; font-size: .9em; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .req { display: inline-flex; gap: 6px; align-items: center; }
  .req input, select { font: inherit; padding: 2px 6px; }
  .tag { font-size: .85em; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; }
  .pending { border: 1px dashed #F5843C; color: #F5843C; font-weight: normal; }
  .requests .row { margin: 6px 0; }
  .teams h3 { font-size: 1em; margin: 16px 0 4px; }
  label.team { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
  .p0 { border: 1px dashed var(--dim); color: var(--dim); font-weight: normal; }
  body { display: flex; height: 100vh; overflow: hidden; }
  nav { width: 200px; flex: none; border-right: 1px solid var(--line); padding: 16px 8px; background: var(--card); }
  nav .app { font-weight: bold; padding: 4px 10px 14px; }
  nav button { display: block; width: 100%; text-align: left; background: transparent; color: var(--fg); margin: 2px 0; }
  nav button.on { background: #8C54D9; color: #fff; }
  main { flex: 1; overflow-y: auto; }
  .page { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
  .list { border: 1px solid var(--line); border-radius: 10px; background: var(--card); margin: 12px 0; }
  .item { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item.click { cursor: pointer; }
  .item.click:hover { background: color-mix(in srgb, #8C54D9 8%, transparent); }
  .item .text { flex: 1; }
  .item .sub { color: var(--dim); font-size: .9em; }
  .banner { background: #F9C29B; color: #1d1d1d; padding: 10px 16px; border-radius: 8px; margin-bottom: 12px; }
  .empty { text-align: center; padding: 48px 16px; color: var(--dim); }
  .switch { width: 40px; height: 22px; accent-color: #8C54D9; }
  input[type=number] { width: 80px; font: inherit; padding: 2px 6px; }
  progress { width: 140px; accent-color: #8C54D9; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1d1d1d; color: #fff;
           padding: 10px 18px; border-radius: 8px; display: none; max-width: 80%; z-index: 10; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg); max-width: 480px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  dialog p { white-space: pre-line; }
</style>
</head>
<body>
<nav>
  <div class="app">aIwalk System Setup</div>
  <button data-page="android" class="linux">Android Phone</button>
  <button data-page="vm" class="linux">Windows VM</button>
  <button data-page="team">Team access</button>
</nav>
<main>
  <div class="page" id="android" hidden></div>
  <div class="page" id="vm" hidden></div>
  <div class="page" id="team" hidden>
    <h1>Team access</h1>
    <p id="who" class="dim">Reading GitHub…</p>
    <div id="vaults"></div>
  </div>
</main>
<div id="toast"></div>
<dialog id="dialog"></dialog>
<script>
const { invoke } = window.__TAURI__.core;
const listen = window.__TAURI__.event.listen;
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

let toastTimer;
function toast(text) {
  if (!text) return;
  const t = document.getElementById("toast");
  t.textContent = text; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = "none", 5000);
}

// ask(title, body, [[id, label, primary?]...], extra element) -> the id chosen, or null when dismissed
function ask(title, body, buttons, extra) {
  const d = document.getElementById("dialog");
  d.replaceChildren(el("h3", null, title), el("p", null, body));
  if (extra) d.append(extra);
  const row = el("div", "buttons");
  return new Promise(done => {
    buttons.forEach(([id, label, primary]) => {
      const b = el("button", primary ? "" : "ghost", label);
      b.onclick = () => { d.close(); done(id); };
      row.append(b);
    });
    d.append(row);
    d.onclose = () => done(null);
    d.showModal();
  });
}

// One row in a list: title, subtitle, and whatever controls go on the right.
function item(title, sub, onclick, ...right) {
  const r = el("div", "item" + (onclick ? " click" : ""));
  const t = el("div", "text");
  t.append(el("div", "title", title));
  if (sub) t.append(el("div", "sub", sub));
  r.append(t, ...right);
  if (onclick) r.onclick = onclick;
  return r;
}

function switchBox(on, onchange) {
  const s = el("input", "switch"); s.type = "checkbox"; s.checked = on;
  s.onclick = e => e.stopPropagation();
  s.onchange = () => onchange(s.checked, s);
  return s;
}

const pages = { team: () => loadTeam(), android: () => refreshPhones(true), vm: () => refreshVm() };
let current;
function go(name) {
  current = name;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.page === name));
  document.querySelectorAll(".page").forEach(p => p.hidden = p.id !== name);
  pages[name]();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => go(b.dataset.page));
</script>
<script src="team.js"></script>
<script src="android.js"></script>
<script src="vm.js"></script>
<script>
invoke("platform").then(os => {
  // the phone and VM modules need a Linux computer
  if (os !== "linux") { document.querySelectorAll("nav .linux").forEach(b => b.remove()); go("team"); }
  else go("android");
});
</script>
</body>
</html>
