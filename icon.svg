  <rect x="8" y="96" width="112" height="24" rx="0" fill="#1565C0" opacity="0.35"/>
  <!-- monitor, behind -->
  <rect x="38" y="30" width="64" height="44" rx="6" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.9"/>
  <rect x="62" y="74" width="16" height="10" fill="#FFFFFF" opacity="0.9"/>
